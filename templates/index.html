<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YTCH</title>
    <style>
        /* thanks oliver - https://stackoverflow.com/a/60192837 */

        .video-background {
          position: relative;
          overflow: hidden;
          width: 100vw;
          height: 100vh;
        }

        .video-background iframe {
          position: absolute;
          top: 50%;
          left: 50%;
          width: 100vw;
          height: 100vh;
          transform: translate(-50%, -50%);
        }

        @media (min-aspect-ratio: 16/9) {
          .video-background iframe {
            /* height = 100 * (9 / 16) = 56.25 */
            height: 56.25vw;
          }
        }
        @media (max-aspect-ratio: 16/9) {
          .video-background iframe {
            /* width = 100 / (9 / 16) = 177.777777 */
            width: 177.78vh;
          }
        }
    </style>
</head>
<body>
    <div class="video-background" id="player"></div>

    <script src="http://www.youtube.com/player_api"></script>

    <script>

        var video = "{% if video %}{{ video }}{% else %}0Bmhjf0rKe8{% endif %}"
        // create youtube player
        var player;
        function onYouTubePlayerAPIReady() {
            player = new YT.Player('player', {
              videoId: video,
              playerVars: {'autoplay': 1, 'controls': 0, 'enablejsapi': 1},
              events: {
                onReady: onPlayerReady,
                onStateChange: onPlayerStateChange
              }
            });
        }

        function onPlayerReady(event) {
            player.playvideo();
        }

        // when video ends
        function onPlayerStateChange(event) {
            if(event.data === 0) {
                fetch("/next?channel={{ channel }}")
                  .then((response) => response.json())
                  .then((json) => player.loadVideoById(json.video));
            }
        }

    </script>

<h1>{{ video }}</h1>
<h1>{{ host }}</h1>
<h1>{{ channel }}</h1>

</body>
</html>
